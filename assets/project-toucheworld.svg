<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">TouchéWorld — camera and hand control concept</title>
  <desc id="desc">An original conceptual illustration of a camera trajectory and an articulated hand skeleton inside a first-person room. It is not a generated video frame or an experimental result.</desc>
  <defs>
    <clipPath id="scene"><rect x="180" y="188" width="570" height="342" rx="12"/></clipPath>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c9dcd6"/><stop offset="1" stop-color="#a9c9c0"/></linearGradient>
    <linearGradient id="frustum" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#75a7ad" stop-opacity=".42"/><stop offset="1" stop-color="#75a7ad" stop-opacity=".08"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="#e4eef1"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#203c35">
    <text x="49" y="75" font-size="14" letter-spacing="2.4">CAMERA + HAND CONTROL</text>
    <text x="47" y="133" font-size="47" font-weight="600" letter-spacing="-1.8">TOUCHÉWORLD</text>
    <text x="724" y="75" font-size="15" fill="#668787">01</text>
  </g>

