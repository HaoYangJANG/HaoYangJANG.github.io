    <path d="M373 265H439V345H373Z" fill="#a8c2c2"/>
    <path d="M380 272H432V338H380Z" fill="#c1d9da"/>
    <path d="M440 364H657L691 397H421Z" fill="#f1f5ef"/>
    <path d="M421 397H691V408H421Z" fill="#a2bdb5"/>
    <path d="M439 408V458M672 408V458" stroke="#6e9487" stroke-width="8"/>
