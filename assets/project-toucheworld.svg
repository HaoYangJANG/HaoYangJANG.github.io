  </g>

  <!-- Camera rays and a short navigation path. -->
  <path d="M147 431 342 248V420Z" fill="url(#frustum)"/>
  <path d="M147 431 342 248M147 431 342 420M342 248V420" fill="none" stroke="#66939c" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M61 503C98 478 147 488 179 502S240 527 286 487" fill="none" stroke="#50868a" stroke-width="2.8" stroke-dasharray="5 7"/>
